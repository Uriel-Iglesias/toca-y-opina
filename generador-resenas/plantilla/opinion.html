<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="{{BG}}" />
<title>La teva ressenya · {{NOMBRE}}</title>
<link rel="icon" href="{{FAVICON}}" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:{{BG}}; --on-dark:{{ON_DARK}}; --muted:{{MUTED}}; --subtle:{{SUBTLE}};
    --line:rgba(230,190,105,.18); --line2:rgba(230,190,105,.32);
    --gold:{{GOLD}}; --gold-bright:{{GOLD_BRIGHT}};
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(230,190,105,.12), transparent 55%),
      var(--bg);
    color:var(--on-dark);
    min-height:100svh;
    display:flex; align-items:center; justify-content:center;
    padding:3rem 1.5rem max(3rem,env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    text-align:center;
  }
  .font-display{font-family:'Cormorant Garamond',Georgia,serif;}
  ::selection{background:var(--gold);color:#fff;}
  .wrap{width:100%;max-width:30rem;}
  .hidden{display:none !important;}

  .logo{height:2.25rem;width:auto;display:block;margin:0 auto 1.5rem;}
  .logo-mono{width:3rem;height:3rem;margin:0 auto 1.5rem;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--gold-bright),#8a6a24);color:#1A140A;font-weight:800;font-size:1.2rem;letter-spacing:.02em;}

  /* Estrelles que ja ha triat el client (només mostra) */
  .stars{display:flex;justify-content:center;gap:.35rem;margin:0 0 1.5rem;}
  .dstar{width:1.85rem;height:1.85rem;color:var(--subtle);}
  .dstar.lit{color:var(--gold-bright);filter:drop-shadow(0 4px 12px rgba(230,190,105,.4));}
  .dstar svg{width:100%;height:100%;display:block;}

  h1{margin:0;font-weight:500;line-height:1.1;font-size:clamp(2rem,8vw,2.9rem);}

  form{margin-top:1.75rem;display:flex;flex-direction:column;gap:1.1rem;}
  textarea{
    width:100%;font:inherit;font-size:.95rem;color:var(--on-dark);
    background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;
    padding:.9rem 1rem;resize:none;line-height:1.5;min-height:8rem;text-align:left;
    transition:border-color .2s ease, box-shadow .2s ease;
  }
  textarea::placeholder{color:rgba(178,168,146,.55);}
  textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(230,190,105,.14);}

  .submit{
    height:3.25rem;border:0;border-radius:999px;cursor:pointer;
    background:var(--gold);color:#1A140A;font:inherit;font-size:15px;font-weight:600;
    transition:background-color .2s ease, opacity .2s ease;
  }
  .submit:hover{background:var(--gold-bright);}
  .submit:disabled{opacity:.6;cursor:default;}

  /* Google sempre disponible · discret, sense subratllat */
  .google{display:block;text-align:center;margin:.25rem 0 0;font-size:.9rem;color:var(--muted);text-decoration:none;transition:color .2s ease;}
  .google:hover{color:var(--on-dark);}

  .thanks{padding:2rem 0;}
  .check{margin:0 auto;display:grid;place-items:center;width:4rem;height:4rem;border-radius:999px;border:1px solid var(--line2);color:var(--gold-bright);}
  .check svg{width:2rem;height:2rem;}
  .thanks h1{margin-top:1.5rem;}
  .thanks p{margin:.75rem auto 0;max-width:24rem;color:var(--muted);line-height:1.6;}

  .credit{margin:2.5rem 0 0;text-align:center;font-size:.66rem;color:var(--subtle);opacity:.55;letter-spacing:.01em;}
  .credit a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(133,124,107,.4);}
  .credit .heart{color:var(--gold);opacity:.85;}

  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .wrap{animation:pop .5s cubic-bezier(.16,1,.3,1) both;}
  @media (prefers-reduced-motion: reduce){ .wrap{animation:none!important;} }
</style>
</head>
<body>
  <main class="wrap">
    <div id="formCard">
      {{LOGO}}
      <div class="stars" id="stars" aria-hidden="true"></div>
      <h1 class="font-display">Escriu la teva ressenya</h1>

      <form id="opinionForm" action="https://formsubmit.co/{{EMAIL}}" method="POST">
        <input type="hidden" name="_subject" value="Ressenya privada · web {{NOMBRE}}">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="estrelles" id="estrellesField" value="">
        <textarea id="msg" name="missatge" rows="5" placeholder="Escriu aquí la teva ressenya… (opcional)"></textarea>
        <button type="submit" class="submit">Enviar</button>
        <a class="google" id="googleLink" href="{{GOOGLE_URL}}">Publica-la a Google</a>
      </form>
    </div>

    <div id="thanks" class="thanks hidden">
      <div class="check">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m5 13 4 4L19 7"/></svg>
      </div>
      <h1 class="font-display">Moltes gràcies!</h1>
      <p>Gràcies per deixar la teva ressenya. Ens ajuda moltíssim a millorar i a seguir cuidant cada detall per a tu.</p>
    </div>

    <p class="credit">Fet amb <span class="heart" aria-hidden="true">♥</span> per <a href="https://tocayopina.es" target="_blank" rel="noopener">Toca y Opina</a></p>
  </main>

  <script>
    // Estrelles que ha triat el client a la pàgina anterior (?stars=N)
    const params = new URLSearchParams(location.search);
    const stars = Math.min(5, Math.max(0, parseInt(params.get('stars'), 10) || 0));
    const starsWrap = document.getElementById('stars');
    const starSVG = (lit) => `<svg viewBox="0 0 24 24" fill="${lit ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m12 2.6 2.95 6.1 6.65.95-4.8 4.7 1.15 6.6L12 18.9 6.1 21l1.15-6.6-4.8-4.7 6.65-.95L12 2.6Z"/></svg>`;
    if (stars > 0) {
      let html = '';
      for (let i = 1; i <= 5; i++) html += `<span class="dstar ${i <= stars ? 'lit' : ''}">${starSVG(i <= stars)}</span>`;
      starsWrap.innerHTML = html;
      document.getElementById('estrellesField').value = stars + '/5';
    } else {
      starsWrap.style.display = 'none';
    }

    // Enviament sense sortir de la pàgina
    const form = document.getElementById('opinionForm');
    const card = document.getElementById('formCard');
    const thanks = document.getElementById('thanks');
    const AJAX = 'https://formsubmit.co/ajax/{{EMAIL}}';
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('.submit');
      btn.disabled = true; btn.textContent = 'Enviant…';
      try {
        await fetch(AJAX, { method:'POST', headers:{'Accept':'application/json'}, body:new FormData(form) });
      } catch(_) { /* sense xarxa: confirmem igualment */ }
      card.classList.add('hidden');
      thanks.classList.remove('hidden');
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  </script>
</body>
</html>
